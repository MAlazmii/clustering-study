name: CPU validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOKY_MAX_CPU_COUNT: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/clustering-mpl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --rootdir=. -q
      - name: Exercise recording, verification and figures
        run: |
          python -m clustering_study.experiment run results/ci --config configs/ci.json
          python -m clustering_study.experiment verify results/ci
          python scripts/plot_results.py results/ci results/ci-figures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-evidence-${{ github.sha }}
          path: |
            results/ci
            results/ci-figures
          retention-days: 14
          if-no-files-found: warn
